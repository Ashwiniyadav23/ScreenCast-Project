# Upstream Backend Load Balancer Cluster with Sticky Sessions
upstream backend_cluster {
    ip_hash; # Sticky sessions based on client IP for Socket.IO state consistency
    server backend:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # High performance Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Client upload limits for recordings
    client_max_body_size 100M;

    # Handle React SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API & Health Check requests to backend cluster
    location /api/ {
        proxy_pass http://backend_cluster/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Socket.IO WebSocket connections with sticky session handling
    location /socket.io/ {
        proxy_pass http://backend_cluster/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Serve static uploaded recording files
    location /uploads/ {
        proxy_pass http://backend_cluster/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Cache static frontend assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
